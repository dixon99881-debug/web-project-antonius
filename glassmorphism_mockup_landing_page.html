<!DOCTYPE html>
<html lang="en" class="h-full dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism Mockup Studio</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter & Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Three.js CDN for 3D Chrome Visuals -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        canvas: '#0b0c10',
                        glass: {
                            bg: 'rgba(255, 255, 255, 0.03)',
                            border: 'rgba(255, 255, 255, 0.15)',
                            highlight: 'rgba(255, 255, 255, 0.25)'
                        }
                    },
                    boxShadow: {
                        'glass-card': '0 30px 60px -12px rgba(0, 0, 0, 0.75), inset 0 1px 1px 0 rgba(255, 255, 255, 0.2)',
                        'glow-teal': '0 0 40px rgba(45, 212, 191, 0.25)',
                        'glow-purple': '0 0 40px rgba(168, 85, 247, 0.25)'
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Glassmorphism Noise Overlay & Grain */
        body {
            background-color: #0b0c10;
            color: #f3f4f6;
            overflow-x: hidden;
            font-family: 'Inter', sans-serif;
            user-select: none;
        }

        /* Frosted Glass Window Frame */
        .glass-window {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0.02) 100%);
            backdrop-filter: blur(28px) saturate(140%);
            -webkit-backdrop-filter: blur(28px) saturate(140%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 
                0 40px 80px -15px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.3),
                inset 0 -1px 0 0 rgba(255, 255, 255, 0.05);
            position: relative;
        }

        /* Subtle metallic top highlight shine on the glass frame */
        .glass-window::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, 
                rgba(255, 255, 255, 0) 0%, 
                rgba(255, 255, 255, 0.5) 35%, 
                rgba(255, 255, 255, 0.8) 50%, 
                rgba(255, 255, 255, 0.5) 65%, 
                rgba(255, 255, 255, 0) 100%);
            pointer-events: none;
        }

        /* Subtle Frosted Noise Texture */
        .glass-grain {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.035'/%3E%3C/svg%3E");
        }

        /* Custom Hover Transitions for Nav & Icons */
        .nav-link {
            transition: all 0.25s ease;
            position: relative;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 50%;
            width: 0%;
            height: 2px;
            background: #ffffff;
            transition: all 0.25s ease;
            transform: translateX(-50%);
            border-radius: 2px;
            opacity: 0;
        }

        .nav-link:hover::after, .nav-link.active::after {
            width: 100%;
            opacity: 1;
        }

        .nav-link.active {
            color: #ffffff;
            font-weight: 600;
        }

        /* Smooth Canvas Fade In */
        #webgl-canvas {
            opacity: 0;
            transition: opacity 1.2s ease-out;
        }
        #webgl-canvas.loaded {
            opacity: 1;
        }

        /* Toast Popup Animation */
        @keyframes slideUp {
            from { transform: translateY(100%) scale(0.9); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }
        .toast-animate {
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Glass Modal Custom Scrollbar */
        .glass-modal-scroll::-webkit-scrollbar {
            width: 5px;
        }
        .glass-modal-scroll::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 6px;
        }
        .glass-modal-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 6px;
        }
        .glass-modal-scroll::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Glassmorphism Input Field */
        .glass-input {
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: inset 0 1px 1px 0 rgba(255, 255, 255, 0.12), 0 4px 14px -2px rgba(0, 0, 0, 0.25);
            transition: all 0.25s ease;
        }
        .glass-input:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.22);
            box-shadow: inset 0 1px 1px 0 rgba(255, 255, 255, 0.18), 0 6px 18px -2px rgba(0, 0, 0, 0.35);
        }
        .glass-input:focus-within {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 
                0 0 25px rgba(255, 255, 255, 0.15), 
                inset 0 1px 2px rgba(255, 255, 255, 0.25),
                0 6px 20px -2px rgba(0, 0, 0, 0.4);
        }

        /* Glassmorphism Primary Action Button */
        .glass-btn-primary {
            position: relative;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.05) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 
                0 15px 35px -5px rgba(0, 0, 0, 0.5),
                inset 0 1px 1px 0 rgba(255, 255, 255, 0.45),
                inset 0 -1px 1px 0 rgba(255, 255, 255, 0.08);
            color: #ffffff;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        .glass-btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0) 100%);
            border-radius: inherit;
            pointer-events: none;
        }

        .glass-btn-primary:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0.1) 100%);
            border-color: rgba(255, 255, 255, 0.45);
            box-shadow: 
                0 20px 40px -5px rgba(0, 0, 0, 0.6),
                0 0 25px rgba(255, 255, 255, 0.18),
                inset 0 1px 1px 0 rgba(255, 255, 255, 0.6);
            transform: translateY(-1px);
        }

        .glass-btn-primary:active {
            transform: translateY(0px) scale(0.985);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.04) 100%);
            box-shadow: 
                0 8px 20px -3px rgba(0, 0, 0, 0.45),
                inset 0 1px 1px 0 rgba(255, 255, 255, 0.3);
        }

        /* Glassmorphism Capsule Pill */
        .glass-pill {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.18), 0 4px 12px rgba(0, 0, 0, 0.25);
            transition: all 0.25s ease;
        }

        .glass-pill:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.3), 0 6px 16px rgba(0, 0, 0, 0.35);
            transform: translateY(-0.5px);
        }

        /* Autofill Dark Theme Preservation */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus {
            -webkit-text-fill-color: #ffffff;
            -webkit-box-shadow: 0 0 0px 1000px rgba(18, 22, 30, 0.95) inset;
            box-shadow: 0 0 0px 1000px rgba(18, 22, 30, 0.95) inset;
            transition: background-color 5000s ease-in-out 0s;
        }

        /* Form Error Shake Animation */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .shake-animate {
            animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }

        /* Smooth Frosted Backdrop & Contact Modal Transition */
        #contact-modal {
            visibility: hidden;
            pointer-events: none;
            transition: visibility 0.7s ease-in-out;
        }
        #contact-modal.active {
            visibility: visible;
            pointer-events: auto;
            transition: visibility 0s;
        }

        #contact-modal-backdrop {
            background-color: rgba(0, 0, 0, 0);
            backdrop-filter: blur(0px);
            -webkit-backdrop-filter: blur(0px);
            transition: backdrop-filter 0.7s ease-in-out,
                        -webkit-backdrop-filter 0.7s ease-in-out,
                        background-color 0.7s ease-in-out;
        }
        #contact-modal.active #contact-modal-backdrop {
            background-color: rgba(0, 0, 0, 0.58);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: backdrop-filter 0.7s ease-in-out,
                        -webkit-backdrop-filter 0.7s ease-in-out,
                        background-color 0.7s ease-in-out;
        }

        /* High-End Frosted Glassmorphism Contact Modal Window */
        #contact-modal-card {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.13) 0%, rgba(255, 255, 255, 0.03) 45%, rgba(255, 255, 255, 0.08) 100%);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.22);
            box-shadow: 
                0 40px 100px -20px rgba(0, 0, 0, 0.9),
                0 0 50px rgba(255, 255, 255, 0.05),
                inset 0 1px 1px 0 rgba(255, 255, 255, 0.6),
                inset 0 -1px 1px 0 rgba(255, 255, 255, 0.12);
            position: relative;
            opacity: 0;
            transform: scale(0.92) translateY(12px);
            transition: opacity 0.4s ease-out,
                        transform 0.4s ease-out;
        }
        #contact-modal-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, 
                rgba(255, 255, 255, 0) 0%, 
                rgba(255, 255, 255, 0.7) 25%, 
                rgba(255, 255, 255, 1) 50%, 
                rgba(255, 255, 255, 0.7) 75%, 
                rgba(255, 255, 255, 0) 100%);
            pointer-events: none;
            z-index: 20;
        }
        #contact-modal.active #contact-modal-card {
            opacity: 1;
            transform: scale(1) translateY(0);
            transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* WhatsApp Glass Medallion Tile */
        .glass-icon-tile {
            position: relative;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.04) 100%);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.28);
            box-shadow: 
                0 15px 35px -5px rgba(0, 0, 0, 0.6),
                inset 0 1px 1px 0 rgba(255, 255, 255, 0.7),
                inset 0 -1px 1px 0 rgba(255, 255, 255, 0.15),
                0 0 25px rgba(255, 255, 255, 0.1);
        }
        .glass-icon-tile::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0) 100%);
            border-radius: inherit;
            pointer-events: none;
        }

        /* Recessed Glass Phone Number Display Plate */
        .glass-number-plate {
            position: relative;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0.02) 100%);
            border: 1px solid rgba(255, 255, 255, 0.16);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: 
                inset 0 1px 1px 0 rgba(255, 255, 255, 0.35),
                inset 0 -1px 1px 0 rgba(0, 0, 0, 0.4),
                0 8px 24px -4px rgba(0, 0, 0, 0.35);
        }

        /* Frosted Glass Modal Primary CTA */
        .glass-modal-cta {
            position: relative;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.24) 0%, rgba(255, 255, 255, 0.09) 100%);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.38);
            box-shadow: 
                0 15px 35px -5px rgba(0, 0, 0, 0.5),
                inset 0 1px 1.5px 0 rgba(255, 255, 255, 0.75),
                inset 0 -1px 1px 0 rgba(255, 255, 255, 0.12);
            color: #ffffff;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }
        .glass-modal-cta::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 100%);
            border-radius: inherit;
            pointer-events: none;
        }
        .glass-modal-cta:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.34) 0%, rgba(255, 255, 255, 0.15) 100%);
            border-color: rgba(255, 255, 255, 0.65);
            box-shadow: 
                0 20px 40px -5px rgba(0, 0, 0, 0.6),
                0 0 25px rgba(255, 255, 255, 0.28),
                inset 0 1px 2px 0 rgba(255, 255, 255, 0.9);
            transform: translateY(-1px);
        }
        .glass-modal-cta:active {
            transform: translateY(0px) scale(0.985);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0.08) 100%);
        }

        /* Frosted Glass Modal Secondary Copy Button */
        .glass-modal-sub-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.22), 0 4px 12px rgba(0, 0, 0, 0.25);
            transition: all 0.25s ease;
        }
        .glass-modal-sub-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.32);
            box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.38), 0 6px 16px rgba(0, 0, 0, 0.35);
            transform: translateY(-0.5px);
        }
    </style>
</head>

<body class="h-full w-full overflow-hidden flex items-center justify-center relative select-none">

    <!-- 3D WebGL Background Canvas -->
    <canvas id="webgl-canvas" class="fixed inset-0 w-full h-full z-0 pointer-events-none"></canvas>

    <!-- Background Dynamic Ambient Lights/Glows -->
    <div id="glow-1" class="fixed top-1/4 left-1/4 w-96 h-96 bg-slate-500/10 rounded-full filter blur-[120px] pointer-events-none z-0 transition-all duration-700"></div>
    <div id="glow-2" class="fixed bottom-1/4 right-1/4 w-96 h-96 bg-zinc-400/10 rounded-full filter blur-[120px] pointer-events-none z-0 transition-all duration-700"></div>

    <!-- Main Glass Container Workspace -->
    <main class="relative z-10 w-full max-w-5xl mx-4 sm:mx-6 md:mx-8 my-auto">
        
        <!-- Glassmorphism Card Frame matching screenshot -->
        <div id="main-card" class="glass-window glass-grain rounded-[24px] sm:rounded-[28px] overflow-hidden flex flex-col min-h-[500px] sm:min-h-[560px] md:min-h-[620px] transition-transform duration-300 ease-out">
            
            <!-- Window Top Bar Controls -->
            <div class="h-12 sm:h-14 px-5 sm:px-6 flex items-center justify-between border-b border-white/10 bg-black/20 backdrop-blur-md">
                
                <!-- Mac-Style Window Control Buttons -->
                <div class="flex items-center space-x-2.5 sm:space-x-3">
                    <button id="btn-close" title="Close" class="w-3.5 h-3.5 rounded-full bg-[#ff5f56] hover:brightness-110 active:scale-95 transition-all duration-150 flex items-center justify-center group shadow-sm">
                        <span class="opacity-0 group-hover:opacity-100 text-[9px] text-red-950 font-bold leading-none">×</span>
                    </button>
                    <button id="btn-minimize" title="Minimize" class="w-3.5 h-3.5 rounded-full bg-[#ffbd2e] hover:brightness-110 active:scale-95 transition-all duration-150 flex items-center justify-center group shadow-sm">
                        <span class="opacity-0 group-hover:opacity-100 text-[9px] text-amber-950 font-bold leading-none">-</span>
                    </button>
                    <button id="btn-expand" title="Expand" class="w-3.5 h-3.5 rounded-full bg-[#27c93f] hover:brightness-110 active:scale-95 transition-all duration-150 flex items-center justify-center group shadow-sm">
                        <span class="opacity-0 group-hover:opacity-100 text-[7px] text-green-950 font-bold leading-none">┼</span>
                    </button>
                </div>

                <!-- Centered URL Address -->
                <div class="absolute left-1/2 -translate-x-1/2 flex items-center space-x-2 text-xs sm:text-sm text-white/40 tracking-wider font-light hover:text-white/70 transition-colors cursor-default">
                    <svg class="w-3.5 h-3.5 text-white/30" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                    </svg>
                    <span id="url-text" class="select-all">www.website.com</span>
                </div>

                <!-- Spacer for layout balance -->
                <div class="w-16"></div>
            </div>

            <!-- Glass Card Content Area -->
            <div class="flex-1 flex flex-col justify-between p-6 sm:p-10 md:p-14 relative">

                <!-- Header Navigation Bar (Top Right) -->
                <header class="flex justify-end items-center mb-8 sm:mb-12">
                    <nav class="flex items-center space-x-5 sm:space-x-8 md:space-x-10 text-xs sm:text-sm font-medium tracking-widest text-white/75">
                        <a href="#home" class="nav-link active hover:text-white" data-tab="home">HOME</a>
                        <a href="#login" class="nav-link hover:text-white" data-tab="login">LOGIN</a>
                    </nav>
                </header>

                <!-- Hero & Dynamic Content Area (Left Aligned Stack) -->
                <div id="content-container" class="max-w-xl w-full transition-all duration-500 ease-in-out">
                    
                    <!-- HOME VIEW -->
                    <div id="view-home" class="transition-all duration-500">
                        <h1 class="text-4xl sm:text-6xl md:text-7xl font-bold tracking-tight text-white/95 leading-[1.05] font-display drop-shadow-md">
                            Selamat<br>Datang
                        </h1>
                        <p class="hidden mt-4 sm:mt-6 text-3xl sm:text-5xl md:text-6xl font-extralight tracking-tight text-white/70 font-sans"></p>
                    </div>

                    <!-- LOGIN VIEW (Glassmorphism Styled Form) -->
                    <div id="view-login" class="hidden w-full max-w-md transition-all duration-500">
                        <!-- Login Header -->
                        <div class="space-y-1.5 mb-5 sm:mb-6">
                            <h2 class="text-2xl sm:text-3xl md:text-4xl font-bold tracking-tight text-white font-display drop-shadow-sm">
                                Welcome Back
                            </h2>
                            <p class="text-xs sm:text-sm text-white/55 font-light">
                                Masukkan kredensial akun untuk mengakses studio.
                            </p>
                        </div>

                        <!-- Login Form -->
                        <form id="login-form" onsubmit="handleLoginSubmit(event)" class="space-y-4" novalidate>
                            
                            <!-- Username / Email Input -->
                            <div class="space-y-1.5">
                                <label for="login-username" class="block text-[11px] sm:text-xs font-medium tracking-wider uppercase text-white/60">
                                    Username atau Email
                                </label>
                                <div class="glass-input rounded-xl px-3.5 py-2.5 sm:py-3 flex items-center space-x-3 group">
                                    <svg class="w-4 h-4 text-white/40 group-focus-within:text-white shrink-0 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                                    </svg>
                                    <input 
                                        type="text" 
                                        id="login-username" 
                                        name="username"
                                        placeholder="nama@email.com atau username" 
                                        autocomplete="username" 
                                        required
                                        class="w-full bg-transparent outline-none text-white placeholder-white/30 text-xs sm:text-sm selection:bg-white/20"
                                    >
                                </div>
                            </div>

                            <!-- Password Input with Show/Hide toggle -->
                            <div class="space-y-1.5">
                                <label for="login-password" class="block text-[11px] sm:text-xs font-medium tracking-wider uppercase text-white/60">
                                    Password
                                </label>
                                <div class="glass-input rounded-xl px-3.5 py-2.5 sm:py-3 flex items-center space-x-3 group">
                                    <svg class="w-4 h-4 text-white/40 group-focus-within:text-white shrink-0 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                                    </svg>
                                    <input 
                                        type="password" 
                                        id="login-password" 
                                        name="password"
                                        placeholder="••••••••" 
                                        autocomplete="current-password" 
                                        required
                                        class="w-full bg-transparent outline-none text-white placeholder-white/30 text-xs sm:text-sm selection:bg-white/20"
                                    >
                                    <!-- Eye toggle button -->
                                    <button 
                                        type="button" 
                                        id="btn-toggle-password"

    <!-- JavaScript Logic: Three.js Rendering & Interactions -->
    <script>
        // --- 1. Three.js 3D Chrome Scene Setup ---
        let scene, camera, renderer;
        let torus, torus2, sphere1, sphere2, sphere3;
        let rotationSpeed = 0.005;
        let chromeMaterial;
        
        // Mouse Tracking for Interactive Parallax Tilt
        let mouseX = 0, mouseY = 0;
        let targetX = 0, targetY = 0;
        const windowHalfX = window.innerWidth / 2;
        const windowHalfY = window.innerHeight / 2;

        function initThreeJS() {
            const canvas = document.getElementById('webgl-canvas');
            
            // Scene
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0b0c10, 0.04);

            // Camera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 12;

            // Renderer
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.25;

            // Dynamic Generated Environment Map Texture for Sharp Metallic Reflections
            const envTexture = createReflectiveEnvMap();
            scene.environment = envTexture;

            // Material: High-Gloss Metallic Chrome
            chromeMaterial = new THREE.MeshStandardMaterial({
                color: 0xdddddd,
                metalness: 0.98,
                roughness: 0.12,
                envMapIntensity: 2.5
            });

            // 1. Primary Metallic Torus Ring (Large ring wrapping around the right side)
            const torusGeo = new THREE.TorusGeometry(3.6, 0.85, 48, 120);
            torus = new THREE.Mesh(torusGeo, chromeMaterial);
            torus.position.set(2.2, -0.6, -1);
            torus.rotation.x = Math.PI * 0.35;
            torus.rotation.y = Math.PI * 0.15;
            scene.add(torus);

            // 2. Secondary Inner Torus Ring
            const torus2Geo = new THREE.TorusGeometry(2.2, 0.45, 36, 100);
            torus2 = new THREE.Mesh(torus2Geo, chromeMaterial);
            torus2.position.set(-2.8, -1.2, -2.5);
            torus2.rotation.x = -Math.PI * 0.25;
            torus2.rotation.y = Math.PI * 0.4;
            scene.add(torus2);

            // 3. Floating Chrome Spheres (matching screenshot placement)
            const sphereGeo = new THREE.SphereGeometry(0.55, 64, 64);
            sphere1 = new THREE.Mesh(sphereGeo, chromeMaterial);
            sphere1.position.set(4.2, -0.4, 1.2); // Right middle floating sphere
            scene.add(sphere1);

            const sphere2Geo = new THREE.SphereGeometry(0.75, 64, 64);
            sphere2 = new THREE.Mesh(sphere2Geo, chromeMaterial);
            sphere2.position.set(1.8, 2.5, -2); // Top right background sphere
            scene.add(sphere2);

            const sphere3Geo = new THREE.SphereGeometry(0.4, 64, 64);
            sphere3 = new THREE.Mesh(sphere3Geo, chromeMaterial);
            sphere3.position.set(-4.0, 1.8, -1.5); // Top left sphere
            scene.add(sphere3);

            // Lighting System
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            // Key Light (Bright White)
            const dirLight1 = new THREE.DirectionalLight(0xffffff, 2.5);
            dirLight1.position.set(5, 10, 7);
            scene.add(dirLight1);

            // Rim / Accent Light (Cool White / Cyan Tint)
            const dirLight2 = new THREE.DirectionalLight(0x90e0ef, 1.8);
            dirLight2.position.set(-8, -5, -4);
            scene.add(dirLight2);

            // Warm Under Light
            const pointLight = new THREE.PointLight(0xffeedd, 1.5, 20);
            pointLight.position.set(0, -4, 3);
            scene.add(pointLight);

            // Show canvas with smooth fade-in
            canvas.classList.add('loaded');

            // Event Listeners
            window.addEventListener('resize', onWindowResize, false);
            document.addEventListener('mousemove', onDocumentMouseMove, false);

            // Touch support for mobile parallax
            document.addEventListener('touchmove', onTouchMove, { passive: true });

            // Start Animation Loop
            animate();
        }

        // Procedural High-Contrast Environment Map Generator for Chrome Reflections
        function createReflectiveEnvMap() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            // Background studio gradient
            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, '#0f172a');
            grad.addColorStop(0.4, '#1e293b');
            grad.addColorStop(0.7, '#334155');
            grad.addColorStop(1, '#020617');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Soft Studio Light Strips
            ctx.fillStyle = '#ffffff';
            ctx.filter = 'blur(30px)';
            
            // Soft overhead studio softbox
            ctx.beginPath();
            ctx.ellipse(512, 120, 350, 60, 0, 0, Math.PI * 2);
            ctx.fill();

            // Rim highlights
            ctx.fillStyle = '#e2e8f0';
            ctx.beginPath();
            ctx.ellipse(200, 350, 150, 40, -0.2, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.ellipse(820, 300, 180, 50, 0.3, 0, Math.PI * 2);
            ctx.fill();

            const texture = new THREE.CanvasTexture(canvas);
            texture.mapping = THREE.EquirectangularReflectionMapping;
            return texture;
        }

        // Mouse Parallax Event
        function onDocumentMouseMove(event) {
            mouseX = (event.clientX - windowHalfX) * 0.001;
            mouseY = (event.clientY - windowHalfY) * 0.001;
        }

        function onTouchMove(event) {
            if (event.touches.length > 0) {
                mouseX = (event.touches[0].clientX - windowHalfX) * 0.001;
                mouseY = (event.touches[0].clientY - windowHalfY) * 0.001;
            }
        }

        // Window Resize Handler
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            // Smooth Interpolated Parallax (Lerp)
            targetX += (mouseX - targetX) * 0.05;
            targetY += (mouseY - targetY) * 0.05;

            // Rotate 3D Torus Objects
            if (torus) {
                torus.rotation.x += rotationSpeed * 0.6;
                torus.rotation.y += rotationSpeed * 0.8;
                torus.position.x = 2.2 + targetX * 1.5;
                torus.position.y = -0.6 - targetY * 1.5;
            }

            if (torus2) {
                torus2.rotation.x -= rotationSpeed * 0.4;
                torus2.rotation.z += rotationSpeed * 0.5;
                torus2.position.x = -2.8 + targetX * 2.0;
            }

            // Floating Spheres Oscillation
            const time = Date.now() * 0.0015;
            if (sphere1) {
                sphere1.position.y = -0.4 + Math.sin(time * 1.2) * 0.15;
                sphere1.position.x = 4.2 + targetX * 0.8;
            }
            if (sphere2) {
                sphere2.position.y = 2.5 + Math.cos(time * 0.9) * 0.2;
                sphere2.position.x = 1.8 + targetX * 1.2;
            }
            if (sphere3) {
                sphere3.position.y = 1.8 + Math.sin(time * 1.5) * 0.12;
            }

            // Camera subtle motion
            camera.position.x += (targetX * 2 - camera.position.x) * 0.03;
            camera.position.y += (-targetY * 2 - camera.position.y) * 0.03;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }

        // --- 2. Interactive UI Functions (Tabs & Login) ---
        const navLinks = document.querySelectorAll('.nav-link');
        const contentContainer = document.getElementById('content-container');
        const viewHome = document.getElementById('view-home');
        const viewLogin = document.getElementById('view-login');
        const mainCard = document.getElementById('main-card');

        function switchTab(tab) {
            const currentActive = document.querySelector('.nav-link.active')?.getAttribute('data-tab');
            if (currentActive === tab) return;

            // Capture initial height for smooth panel size animation
            const startHeight = mainCard.offsetHeight;
            mainCard.style.height = `${startHeight}px`;

            navLinks.forEach(link => {
                if (link.getAttribute('data-tab') === tab) {
                    link.classList.add('active');
                } else {
                    link.classList.remove('active');
                }
            });

            // Smooth Content Transition
            contentContainer.style.opacity = '0';
            contentContainer.style.transform = 'translateY(8px)';

            setTimeout(() => {
                // Switch DOM visibility
                if (tab === 'login') {
                    if (viewHome) viewHome.classList.add('hidden');
                    if (viewLogin) viewLogin.classList.remove('hidden');
                } else {
                    if (viewLogin) viewLogin.classList.add('hidden');
                    if (viewHome) viewHome.classList.remove('hidden');
                }

                // Compute target height with new content
                mainCard.style.height = 'auto';
                const targetHeight = mainCard.offsetHeight;

                // Reset to startHeight before triggering height transition
                mainCard.style.height = `${startHeight}px`;
                void mainCard.offsetHeight; // Force reflow

                // Smoothly animate panel height to new size (deliberate & graceful 0.8s easing)
                mainCard.style.transition = 'height 0.8s cubic-bezier(0.25, 1, 0.35, 1), transform 0.4s ease-out';
                mainCard.style.height = `${targetHeight}px`;

                // Fade in new view
                contentContainer.style.opacity = '1';
                contentContainer.style.transform = 'translateY(0)';

                if (tab === 'login') {
                    setTimeout(() => {
                        const userInput = document.getElementById('login-username');
                        if (userInput) userInput.focus();
                    }, 200);
                }

                // Cleanup inline height when transition completes
                const onTransitionEnd = (e) => {
                    if (e.propertyName === 'height') {
                        mainCard.style.height = '';
                        mainCard.style.transition = '';
                        mainCard.removeEventListener('transitionend', onTransitionEnd);
                    }
                };
                mainCard.addEventListener('transitionend', onTransitionEnd);

            }, 220);

            // Update Window Address Bar URL dynamically
            document.getElementById('url-text').innerText = `www.website.com/${tab === 'home' ? '' : tab}`;
        }

        navLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const tab = link.getAttribute('data-tab');
                switchTab(tab);
            });
        });

        // Toggle password show/hide
        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('login-password');
            const eyeShow = document.getElementById('eye-icon-show');
            const eyeHide = document.getElementById('eye-icon-hide');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeShow.classList.add('hidden');
                eyeHide.classList.remove('hidden');
            } else {
                pwdInput.type = 'password';
                eyeShow.classList.remove('hidden');
                eyeHide.classList.add('hidden');
            }
        }

        // Auto-fill demo credentials
        function autoFillDemoCredentials() {
            const userInput = document.getElementById('login-username');
            const pwdInput = document.getElementById('login-password');
            if (userInput && pwdInput) {
                userInput.value = 'admin@studio.io';
                pwdInput.value = 'studio2026';
                showToast('Kredensial demo diisikan!');
            }
        }

        // Handle Login Submission
        function handleLoginSubmit(e) {
            e.preventDefault();
            const form = document.getElementById('login-form');
            const usernameInput = document.getElementById('login-username');
            const passwordInput = document.getElementById('login-password');
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();
            const btnText = document.getElementById('login-btn-text');
            const btnIcon = document.getElementById('login-btn-icon');
            const btnSpinner = document.getElementById('login-btn-spinner');
            const submitBtn = document.getElementById('btn-login-submit');

            if (!username || !password) {
                form.classList.remove('shake-animate');
                void form.offsetWidth; // trigger reflow
                form.classList.add('shake-animate');
                showToast('Harap lengkapi username dan password!');
                if (!username) {
                    usernameInput.focus();
                } else {
                    passwordInput.focus();
                }
                setTimeout(() => {
                    form.classList.remove('shake-animate');
                }, 450);
                return;
            }

            // Simulate authenticating state
            submitBtn.disabled = true;
            btnText.innerText = 'Memverifikasi...';
            btnIcon.classList.add('hidden');
            btnSpinner.classList.remove('hidden');

            setTimeout(() => {
                submitBtn.disabled = false;
                btnText.innerText = 'Masuk Sekarang';
                btnIcon.classList.remove('hidden');
                btnSpinner.classList.add('hidden');

                const displayName = username.includes('@') ? username.split('@')[0] : username;
                showToast(`Login berhasil! Selamat datang kembali, ${displayName}.`);
            }, 900);
        }

        // Support direct hash navigation (e.g. #login)
        if (window.location.hash === '#login') {
            switchTab('login');
        }

        // --- 3. WhatsApp Contact Modal & Professional UX Functions ---
        const waBaseNumber = '6281258618494';
        const displayPhoneNumber = '0812-5861-8494';

        function openContactModal() {
            const modal = document.getElementById('contact-modal');
            modal.classList.add('active');
            document.getElementById('url-text').innerText = 'www.website.com/contact';
        }

        function closeContactModal() {
            const modal = document.getElementById('contact-modal');
            modal.classList.remove('active');
            const activeTab = document.querySelector('.nav-link.active')?.getAttribute('data-tab') || 'home';
            document.getElementById('url-text').innerText = `www.website.com/${activeTab === 'home' ? '' : activeTab}`;
        }

        // Close Modal when pressing Escape Key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const modal = document.getElementById('contact-modal');
                if (modal && modal.classList.contains('active')) {
                    closeContactModal();
                }
            }
        });

        // Copy WhatsApp Number to Clipboard with UX Feedback
        function copyWhatsAppNumber() {
            const copyBtn = document.getElementById('btn-copy-wa');
            const copyText = document.getElementById('copy-text');
            const copyIcon = document.getElementById('copy-icon');
            const checkIcon = document.getElementById('check-icon');

            const onCopiedSuccess = () => {
                if (copyText) copyText.innerText = 'Tersalin!';
                if (copyBtn) copyBtn.classList.add('bg-white/20', 'border-white/50', 'text-white', 'shadow-[0_0_20px_rgba(255,255,255,0.2)]');
                if (copyIcon) copyIcon.classList.add('hidden');
                if (checkIcon) checkIcon.classList.remove('hidden');

                showToast(`Nomor WhatsApp (${displayPhoneNumber}) disalin!`);

                setTimeout(() => {
                    if (copyText) copyText.innerText = 'Salin Nomor Telepon';
                    if (copyBtn) copyBtn.classList.remove('bg-white/20', 'border-white/50', 'text-white', 'shadow-[0_0_20px_rgba(255,255,255,0.2)]');
                    if (copyIcon) copyIcon.classList.remove('hidden');
                    if (checkIcon) checkIcon.classList.add('hidden');
                }, 2000);
            };

            const rawNumber = '081258618494';
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(rawNumber).then(onCopiedSuccess).catch(() => {
                    fallbackClipboardCopy(rawNumber);
                    onCopiedSuccess();
                });
            } else {
                fallbackClipboardCopy(rawNumber);
                onCopiedSuccess();
            }
        }

        function fallbackClipboardCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            try {
                document.execCommand('copy');
            } catch (err) {}
            document.body.removeChild(ta);
        }

        // Customizer Panel Toggle
        const customizerBtn = document.getElementById('toggle-customizer');
        const customizerMenu = document.getElementById('customizer-menu');

        customizerBtn.addEventListener('click', () => {
            customizerMenu.classList.toggle('hidden');
            customizerMenu.classList.toggle('flex');
        });

        // Chrome Tint Picker
        function setChromeColor(hexColor, name) {
            if (chromeMaterial) {
                chromeMaterial.color.setHex(hexColor);
                showToast(`Material Tint Changed to ${name.toUpperCase()}`);
            }
        }

        // Glass Frosting Blur Slider
        const blurSlider = document.getElementById('blur-slider');
        const blurVal = document.getElementById('blur-val');
        const glassWindow = document.querySelector('.glass-window');

        blurSlider.addEventListener('input', (e) => {
            const val = e.target.value;
            blurVal.innerText = `${val}px`;
            glassWindow.style.backdropFilter = `blur(${val}px) saturate(140%)`;
            glassWindow.style.webkitBackdropFilter = `blur(${val}px) saturate(140%)`;
        });

        // 3D Speed Slider
        const speedSlider = document.getElementById('speed-slider');
        const speedVal = document.getElementById('speed-val');

        speedSlider.addEventListener('input', (e) => {
            const mult = (e.target.value / 10).toFixed(1);
            speedVal.innerText = `${mult}x`;
            rotationSpeed = 0.005 * mult;
        });

        // Window Control Buttons Action
        document.getElementById('btn-close').addEventListener('click', () => {
            showToast('Window minimize preview');
            glassWindow.style.transform = 'scale(0.96)';
            setTimeout(() => glassWindow.style.transform = 'scale(1)', 300);
        });

        document.getElementById('btn-minimize').addEventListener('click', () => {
            showToast('Minimized Glass Workspace');
        });

        document.getElementById('btn-expand').addEventListener('click', () => {
            showToast('Expanded Fullscreen Workspace');
        });

        // Toast Notification System
        let toastTimeout;
        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            toastMsg.innerText = msg;
            
            toast.classList.remove('hidden');
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }

        // Initialize Three.js scene once DOM and scripts are fully ready
        window.addEventListener('DOMContentLoaded', () => {
            initThreeJS();
        });
    </script>
